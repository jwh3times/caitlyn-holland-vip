name: Version

# Publishes every merge to main as a standard SemVer release tag.
#
# On each push to main this reads the major/minor/build floor from the package.json
# `version` field, computes the next build number for that major/minor pair from
# existing release tags, pushes an annotated tag `v<major>.<minor>.<build>`
# (e.g. v1.2.7), and creates a GitHub Release for that tag.
#
# Why a tag instead of committing a bump back to main:
#   - it works identically on protected branches (no bypass actor or bump-commit needed);
#   - it never re-triggers CI or needs [skip ci] loops;
#   - build numbers are normal SemVer patch/build values and can restart at 0
#     whenever the major or minor version is bumped.
#
# If package.json is bumped to a new major/minor line with build 0 and no matching
# v<major>.<minor>.0 tag exists, the workflow tags that merge as build 0 instead of 1.
#
# To see which build a checkout corresponds to: git describe --tags

on:
  push:
    branches: [main]

permissions:
  contents: write # required to push the build tag

# Serialize runs so two closely-spaced merges can't compute the same build number.
concurrency:
  group: version-main
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next build number

      - name: Compute next SemVer build tag
        id: version
        run: |
          version=$(jq -r .version package.json)
          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Package version '$version' must be plain SemVer x.y.z with no prerelease or metadata."
            exit 1
          fi

          IFS=. read -r major minor requested_build <<< "$version"
          last_build=$(
            git tag --list "v${major}.${minor}.*" \
              | sed -E "s/^v${major}\.${minor}\.//" \
              | grep -E '^(0|[1-9][0-9]*)$' \
              | sort -n \
              | tail -1
          )

          if [ -z "$last_build" ]; then
            build="$requested_build"
          else
            build=$(( last_build + 1 ))
            if [ "$build" -lt "$requested_build" ]; then
              build="$requested_build"
            fi
          fi

          tag="v${major}.${minor}.${build}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Computed tag '${tag}' already exists."
            exit 1
          fi

          {
            echo "version=${major}.${minor}.${build}"
            echo "tag=${tag}"
            echo "build=${build}"
            echo "requested_version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Push tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          build="${{ steps.version.outputs.build }}"
          requested_version="${{ steps.version.outputs.requested_version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

          gh release create "$tag" \
            --title "$tag" \
            --notes "Automated release for ${tag} from ${GITHUB_SHA}."

          {
            echo "### Release published: \`${tag}\`"
            echo ""
            echo "- Requested package version: \`${requested_version}\`"
            echo "- Release version: \`${version}\`"
            echo "- Build number: \`${build}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
