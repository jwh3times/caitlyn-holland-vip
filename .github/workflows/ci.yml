name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token: jobs only read the repo, build, and upload
# artifacts (artifact upload uses the Actions API, not the contents scope).
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage (fails below 80%)
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: out/
          retention-days: 7

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cache the downloaded browser binaries (~100 MB) keyed on the lockfile so
      # they're re-fetched only when the Playwright version changes.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # On a cache hit the binaries are restored but OS-level deps are not cached,
      # so install just those.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ai-parity:
    name: AI Config Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate AI tool config mirrors
        run: npm run sync:ai

      - name: Verify generated AI configs are committed
        run: |
          # .claude/skills and .codex are generated; .agents is the skill source
          # but sync:ai reformats it, so a drifted source shows up here too.
          PATHS=".codex .claude/skills .agents"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            echo "::error::Generated AI tool configs are out of date. Run 'npm run sync:ai' and commit the result."
            git --no-pager diff -- $PATHS
            git status --porcelain -- $PATHS
            exit 1
          fi
          echo "AI tool config mirrors are in sync."

  changelog:
    name: Changelog Version
    runs-on: ubuntu-latest
    # PRs only: on push to main the "next" version has no entry yet, which would
    # false-fail. Branch protection gates the PR, so a PR-only check is sufficient.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, needed by next-version.sh

      - name: Verify CHANGELOG names the target version
        env:
          # The PR *author*, deliberately not github.actor. github.actor is whoever
          # triggered the run, so clicking "Update branch" or re-running a dependabot
          # PR made it a human and silently revoked the exemption below.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot does not write changelog entries; the ship skill backfills
          # them on the next human ship. Exempt bot PRs so they are not blocked.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR — changelog guard exempt."
            exit 0
          fi

          version=$(bash scripts/next-version.sh)
          version_re=$(printf '%s' "$version" | sed 's/\./\\./g')

          if ! grep -Eq "^## \[${version_re}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section for the version this merge will mint. Run /ship to write it."
            exit 1
          fi
          echo "CHANGELOG.md has an entry for ${version}."
