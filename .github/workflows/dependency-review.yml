name: Dependency Review

on:
  pull_request:
    branches: [main]

# Read-only token: the action only needs to read the dependency graph / diff.
permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block PRs that introduce dependencies with known vulnerabilities of
          # high or critical severity. No license policy is configured, so this
          # job does not review licenses; add allow-licenses or deny-licenses to
          # enforce one.
          fail-on-severity: high
