name: Post-deploy Smoke

on:
  push:
    branches: [main]
  schedule:
    # Avoid the top of the hour, when scheduled Actions runs are most likely to be delayed.
    # GitHub may disable this schedule after 60 days without repository activity.
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  smoke:
    name: Live-site Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # Pages publishes a check run, not a deployment_status event, in this repo.
      # Pushes wait for the official Pages check on this exact commit. Scheduled
      # and manual runs validate the canonical live site immediately.
      - name: Wait for production deployment
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/smoke.mjs --wait-for-deployment

      - name: Verify deployed site
        env:
          SITE_URL: https://caitlyn.holland.vip
        run: node scripts/smoke.mjs
